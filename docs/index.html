<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1016" />
  <title>geosteeze — live geographic data on a map</title>

  <!-- Config first; runtime-config.js (optional) overrides it when served by serve.py -->
  <script src="config.js"></script>

  <link rel="preconnect" href="https://unpkg.com" crossorigin />

  <!-- Leaflet + esri-leaflet: lightweight, mobile-friendly 2D web map. -->
  <link
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    rel="stylesheet"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin="" />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin="" defer></script>
  <script src="https://unpkg.com/esri-leaflet@3.0.12/dist/esri-leaflet.js" defer></script>

  <script src="runtime-config.js" defer onerror="/* absent when opened via file:// */"></script>
  <link href="style.css" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <!-- Mobile-only top bar with the drawer toggle. -->
    <header id="topbar">
      <button id="menu-toggle" aria-label="Toggle layer list" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <span class="topbar-brand-row">
        <svg class="globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" /><path d="M3 12h18" /><path d="M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" />
        </svg>
        <h1 class="topbar-brand">geo<span>steeze</span></h1>
      </span>
    </header>

    <div id="backdrop"></div>

    <aside id="sidebar">
      <div id="sheet-grab" aria-hidden="true"></div>
      <header id="brand">
        <div class="brand-row">
          <svg class="globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9" /><path d="M3 12h18" /><path d="M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" />
          </svg>
          <h1>geo<span>steeze</span></h1>
        </div>
        <button id="sidebar-close" aria-label="Close layer list">✕</button>
        <p class="tagline">live geographic data · tap a layer to map it</p>
      </header>

      <div id="controls">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7" /><path d="m21 21-4.3-4.3" />
          </svg>
          <input id="search" type="search" placeholder="Search layers, sources, CRS…" autocomplete="off" />
          <button id="search-clear" type="button" aria-label="Clear search">✕</button>
        </div>
        <div id="filters"><!-- category chips injected here --></div>
        <label class="toggle">
          <input type="checkbox" id="live-only" />
          <span>Validated (live) only</span>
        </label>
      </div>

      <div id="catalog-meta"></div>
      <div id="active-bar">
        <span class="count"><span id="active-count">0</span> layers active</span>
        <button id="clear-all" type="button">Clear all</button>
      </div>
      <ul id="catalog"><!-- layer rows injected here --></ul>
    </aside>

    <main id="map-wrap">
      <div id="map"></div>
      <div id="toast" class="hidden"></div>
    </main>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
